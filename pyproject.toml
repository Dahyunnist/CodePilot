[project]
name = "codepilot-lite"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "openai>=3,<4",
    "pydantic>=2,<3",
]

[project.scripts]
codepilot = "codepilot.cli:entrypoint"

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider"

